networks:
  default:
    name: rover

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: rover
      POSTGRES_USER: rover
      POSTGRES_PASSWORD: rover
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=rover --dbname=rover"]
      interval: 2s
      timeout: 3s
      retries: 30

  rover:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/rover
      DATABASE_USERNAME: rover
      DATABASE_PASSWORD: rover
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 20s
