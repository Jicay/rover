<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rover</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Bruno+Ace+SC&family=Rajdhani:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" th:href="@{/rover.css}">
  <script th:src="@{/joystick.js}" defer></script>
</head>
<body>
<div class="shell">

  <header class="masthead">
    <a class="masthead__mark" th:href="@{/}">Rover</a>
    <span class="masthead__beacon"></span>
    <span class="masthead__status">Liaison établie</span>
    <span class="masthead__spacer"></span>
    <span data-testid="board-id" th:text="${board.id}"></span>
  </header>

  <div data-testid="error" th:if="${error}" th:text="${error}"></div>

  <div class="stage">

    <section class="panel stage__board">
      <div class="horizon" th:text="|Secteur ${board.width} × ${board.height}|"></div>
      <div class="panel__body">
        <table class="grid" data-testid="grid">
          <tbody>
          <tr th:each="row : ${board.rows}">
            <th scope="row" th:text="${row[0].y}"></th>
            <td th:each="cell : ${row}"
                th:attr="data-cell=|${cell.x},${cell.y}|,
                         data-rover=${cell.roverId},
                         data-direction=${cell.direction},
                         data-unit=${cell.colorIndex},
                         data-obstacle=${cell.obstacle} ? 'true' : null">
              <span class="unit-mark" th:if="${cell.roverId}">
                <svg class="unit-mark__arrow" width="26" height="26" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"
                     aria-hidden="true">
                  <path d="M12 19V5"></path>
                  <path d="M5 12l7-7 7 7"></path>
                </svg>
                <span class="unit-mark__name" th:text="${cell.roverId}"></span>
              </span>
              <svg class="rock" th:if="${cell.obstacle}" width="34" height="34" viewBox="0 0 24 24"
                   fill="#3d1d10" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"
                   aria-hidden="true">
                <path d="M3 18l3.5-8L12 7l6.5 4.5L17 18z"></path>
                <path d="M6.5 10l4 3 3-2"></path>
              </svg>
            </td>
          </tr>
          <tr>
            <th></th>
            <th scope="col" th:each="cell : ${board.rows[0]}" th:text="${cell.x}"></th>
          </tr>
          </tbody>
        </table>
      </div>
    </section>

    <div class="stage__side">

      <section class="panel">
        <div class="panel__body">
          <h2 class="panel__title">Unités</h2>
          <p th:if="${board.units.isEmpty()}" data-testid="no-rover">Aucun rover débarqué.</p>
          <div class="units" th:unless="${board.units.isEmpty()}" data-testid="command-rover">
            <label class="unit-card" th:each="unit, stat : ${board.units}"
                   th:attr="data-unit=${unit.colorIndex}, data-direction=${unit.direction}">
              <input type="radio" name="roverId" form="pilot-form" th:value="${unit.id}"
                     th:checked="${stat.first}" th:attr="data-rover-option=${unit.id}">
              <span class="unit-card__badge">
                <svg class="unit-mark__arrow" width="22" height="22" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"
                     aria-hidden="true">
                  <path d="M12 19V5"></path>
                  <path d="M5 12l7-7 7 7"></path>
                </svg>
              </span>
              <span class="unit-card__text">
                <span class="unit-card__name" th:text="${unit.id}"></span>
                <span class="unit-card__fix" th:text="|(${unit.x}, ${unit.y}) · cap ${unit.heading}|"></span>
              </span>
            </label>
          </div>
        </div>
      </section>

      <section class="panel">
        <form method="post" th:action="@{/ui/boards/{id}/rovers(id=${board.id})}" class="panel__body"
              data-testid="deploy-rover-form">
          <h2 class="panel__title">Débarquer</h2>

          <label class="field">
            <span class="field__label">Identifiant</span>
            <input type="text" name="id" required autocomplete="off" data-testid="rover-id">
          </label>

          <div class="field-row">
            <label class="field">
              <span class="field__label">x</span>
              <input type="number" name="x" value="0" min="0" required data-testid="rover-x">
            </label>
            <label class="field">
              <span class="field__label">y</span>
              <input type="number" name="y" value="0" min="0" required data-testid="rover-y">
            </label>
            <label class="field">
              <span class="field__label">Cap</span>
              <select name="direction" data-testid="rover-direction">
                <option value="N">N</option>
                <option value="E">E</option>
                <option value="S">S</option>
                <option value="W">W</option>
              </select>
            </label>
          </div>

          <button type="submit" class="button button--ghost" data-testid="deploy-rover">Débarquer</button>
        </form>
      </section>

    </div>
  </div>

  <section class="panel" th:unless="${board.units.isEmpty()}">
    <form id="pilot-form" method="post" th:action="@{/ui/boards/{id}/commands(id=${board.id})}"
          class="panel__body" data-testid="commands-form">
      <div class="orders__body">

        <div class="field">
          <span class="field__label">Joystick</span>
          <div class="joystick">
            <span></span>
            <button type="button" class="joystick__key" data-command="F" data-testid="joystick-f"
                    aria-label="Ajouter avancer">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 20V5"></path>
                <path d="M5 12l7-7 7 7"></path>
              </svg>
              <span>F</span>
            </button>
            <span></span>

            <button type="button" class="joystick__key" data-command="L" data-testid="joystick-l"
                    aria-label="Ajouter pivoter à gauche">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M9 4L5 8l4 4"></path>
                <path d="M5 8h8a6 6 0 0 1 6 6v3"></path>
              </svg>
              <span>L</span>
            </button>
            <button type="button" class="joystick__key joystick__key--erase" data-testid="joystick-erase"
                    aria-label="Effacer le dernier ordre">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M9 6h10a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H9l-6-6z"></path>
                <path d="M14 10l4 4"></path>
                <path d="M18 10l-4 4"></path>
              </svg>
            </button>
            <button type="button" class="joystick__key" data-command="R" data-testid="joystick-r"
                    aria-label="Ajouter pivoter à droite">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M15 4l4 4-4 4"></path>
                <path d="M19 8h-8a6 6 0 0 0-6 6v3"></path>
              </svg>
              <span>R</span>
            </button>

            <span></span>
            <button type="button" class="joystick__key" data-command="B" data-testid="joystick-b"
                    aria-label="Ajouter reculer">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 4v15"></path>
                <path d="M5 12l7 7 7-7"></path>
              </svg>
              <span>B</span>
            </button>
            <span></span>
          </div>
        </div>

        <label class="field orders__sequence">
          <span class="field__label">Séquence</span>
          <input type="text" name="commands" autocomplete="off" data-testid="command-sequence">
          <span class="field__hint">
            Haut et bas avancent ou reculent, gauche et droite font pivoter sur place.
            Le champ reste modifiable à la main.
          </span>
        </label>

        <div class="orders__launch">
          <button type="submit" class="button" data-testid="send-commands">Exécuter</button>
        </div>

      </div>
    </form>
  </section>

</div>
</body>
</html>
